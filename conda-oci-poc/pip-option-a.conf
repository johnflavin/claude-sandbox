# pip.conf -- Option A: PyPI Proxy Cache (devpi / proxpi / Nexus)
#
# Deploy this to the Jupyter pod base image at one of:
#   /etc/pip.conf                          (system-wide)
#   ~/.config/pip/pip.conf                 (per-user)
#
# Or set via environment variable:
#   PIP_INDEX_URL=https://staging.example.com:3141/root/pypi/+simple/
#
# Replace "staging.example.com" with your actual staging node hostname.
# Replace port with your devpi/proxpi/Nexus PyPI repository port.

[global]
index-url = https://staging.example.com:3141/root/pypi/+simple/
trusted-host = staging.example.com

# If using Nexus as the PyPI proxy:
# index-url = https://staging.example.com:8081/repository/pypi-proxy/simple/

# Disable searching the default PyPI index entirely.
# This ensures all requests go through the proxy.
# extra-index-url should NOT be set to pypi.org in air-gapped environments.

[install]
# Timeout for connections to the proxy (seconds).
timeout = 60
