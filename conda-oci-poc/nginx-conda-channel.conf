# nginx-conda-channel.conf -- Option C: Serve local conda cache via nginx
#
# This nginx config serves the conda-oci-mirror pull-cache directory as a
# static HTTP conda channel. Deploy on the staging node.
#
# The cache directory structure (populated by pull-cache-job.sh) looks like:
#   /var/conda-cache/conda-forge/linux-64/repodata.json
#   /var/conda-cache/conda-forge/linux-64/<package>.conda
#   /var/conda-cache/conda-forge/noarch/repodata.json
#   /var/conda-cache/conda-forge/noarch/<package>.conda

server {
    listen 8080;
    server_name staging.example.com;

    # Serve the conda cache directory.
    location /conda/ {
        alias /var/conda-cache/;

        # Enable directory listing so conda can discover channels.
        autoindex on;

        # Cache headers -- packages are immutable, repodata is not.
        location ~* repodata\.json$ {
            alias /var/conda-cache/;
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        location ~* \.(conda|tar\.bz2)$ {
            alias /var/conda-cache/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    # Health check endpoint.
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
