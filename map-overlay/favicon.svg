<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- A three-panel folded map, 42 wide by 40 tall -->
    <g id="m">
      <path d="M0 5 L14 0 L14 35 L0 40 Z"/>
      <path d="M14 0 L28 5 L28 40 L14 35 Z"/>
      <path d="M28 5 L42 0 L42 35 L28 40 Z"/>
    </g>
  </defs>
  <!-- Bottom map -->
  <g transform="translate(2 3)" stroke="#2f5d3a" stroke-width="3" stroke-linejoin="round">
    <use href="#m" fill="#9fd3a8"/>
    <path d="M14 0 L28 5 L28 40 L14 35 Z" fill="#d7eecd"/>
    <path d="M5 28 C12 18 20 30 28 18 S36 12 38 9" fill="none" stroke="#2f7fc4" stroke-linecap="round"/>
  </g>
  <!-- Top map: translucent, offset -->
  <g transform="translate(20 21)" stroke="#c0322a" stroke-width="3" stroke-linejoin="round">
    <use href="#m" fill="#e2483d" fill-opacity="0.4"/>
  </g>
</svg>
